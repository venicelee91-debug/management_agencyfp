<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f4f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="환산인원관리">
<title>환산인원관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap">
<style>
/* Layout: left rail of managers (stacks on phone), right = selected manager's tier ladder, best plan for the chosen target, then full 근접자 worklist */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --ink:#151a2d; --muted:#5d6479; --line:#dde0e8;
  --accent:#1c3264; --accent-soft:#e2e7f1;
  --b0:#8a5a00; --b0s:#fbefd6; --b1:#0f7a5f; --b1s:#dcf3ea; --b2:#1c3264; --b2s:#e2e7f1; --b3:#8a2fb0; --b3s:#f1e2f8; --b4:#4e5568; --b4s:#eceef3;
  --hot:#c2410c; --hots:#ffedd5;
  --done:#9aa0b0;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"Roboto","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1220; --surface:#181c2e; --ink:#e8eaf3; --muted:#9aa1b8; --line:#2b3048;
  --accent:#9db0d8; --accent-soft:#1f2a44;
  --b0:#f0bf5c; --b0s:#3a2e14; --b1:#5fd3ad; --b1s:#143329; --b2:#9db0d8; --b2s:#1f2a44; --b3:#d39af0; --b3s:#33193f; --b4:#aeb4c6; --b4s:#262a3c;
  --hot:#ffb27a; --hots:#3d2312;
  --done:#5c6278; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1220; --surface:#181c2e; --ink:#e8eaf3; --muted:#9aa1b8; --line:#2b3048;
  --accent:#9db0d8; --accent-soft:#1f2a44;
  --b0:#f0bf5c; --b0s:#3a2e14; --b1:#5fd3ad; --b1s:#143329; --b2:#9db0d8; --b2s:#1f2a44; --b3:#d39af0; --b3s:#33193f; --b4:#aeb4c6; --b4s:#262a3c;
  --hot:#ffb27a; --hots:#3d2312;
  --done:#5c6278; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:grid;gap:18px}
.num,.h,strong{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:0}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
header.top h1{margin:0;font-size:22px;letter-spacing:-.01em;text-wrap:balance}
header.top p{margin:2px 0 0;color:var(--muted);font-size:13px}
.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--surface);border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font-size:12px;color:var(--muted)}
.rule{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px}
.rule h2{margin:0;font-size:13px;color:var(--muted);font-weight:500}
.bands{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px}
.bands b{font-weight:700;color:var(--accent)}
.rule p{margin:0;font-size:13px;color:var(--muted)}
.main{display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr)}}
.rail{display:grid;gap:6px}
.mgr{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:10px 12px;border-radius:10px;border:1px solid transparent}
.mgr:hover{background:var(--surface)}
.mgr[aria-pressed="true"]{background:var(--surface);border-color:var(--accent)}
.mgr:focus-visible{outline:2px solid var(--accent)}
.mgr .n{font-weight:700}
.mgr .h{font-weight:700;text-align:right}
.mgr .sub{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.bar{grid-column:1/-1;height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent)}
.panel{display:grid;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:14px;min-width:0}
.card h3{margin:0;font-size:16px}
.headrow{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:baseline}
.headrow h2{margin:0;font-size:20px}
.kv{display:grid}
.kv span{font-size:12px;color:var(--muted)}
.kv strong{font-size:22px;font-weight:700}
.ladder-label{font-size:13px;color:var(--muted);margin:0}
.ladder-wrap{overflow-x:auto}
.ladder{display:grid;grid-template-columns:repeat(13,minmax(54px,1fr));gap:3px;min-width:700px}
.step{all:unset;box-sizing:border-box;border-radius:6px;padding:6px 4px;text-align:center;background:var(--bg);color:var(--muted);font-size:12.5px;border:1px solid transparent;cursor:pointer}
.step .h{font-weight:700;color:var(--ink);font-size:13.5px;display:block}
.step:hover{border-color:var(--accent)}
.step:focus-visible{outline:2px solid var(--accent)}
.step.got{background:var(--accent-soft);cursor:default}
.step.got:hover{border-color:transparent}
.step.cur{background:var(--accent);color:var(--surface);cursor:default}
.step.cur .h{color:var(--surface)}
.step.tgt{border:2px solid var(--accent);background:var(--surface);color:var(--accent)}
.plan-head{display:grid;gap:6px}
.explain{background:var(--accent-soft);border-radius:8px;padding:12px 14px;display:grid;gap:4px}
.explain p{margin:0}
.explain b{color:var(--accent)}
.explain .small{font-size:13px;color:var(--muted)}
.warn{color:var(--hot)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{all:unset;box-sizing:border-box;cursor:pointer;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:500;border:1px solid var(--line)}
.chip[aria-pressed="true"]{border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor}
.chip:focus-visible{outline:2px solid var(--accent)}
.t0{color:var(--b0);background:var(--b0s)} .t1{color:var(--b1);background:var(--b1s)}
.t2{color:var(--b2);background:var(--b2s)} .t3{color:var(--b3);background:var(--b3s)} .t4{color:var(--b4);background:var(--b4s)}
.tall{color:var(--ink);background:var(--bg)}
input[type=search]{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 10px;flex:1;min-width:140px}
label.chk{font-size:13px;color:var(--muted);display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:820px;font-size:14px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:500;background:var(--bg);white-space:nowrap}
td.r,th.r{text-align:right}
td.c,th.c{text-align:center}
tr:last-child td{border-bottom:0}
tr.done td{color:var(--done)} tr.done .tag,tr.done .pri{opacity:.5}
.tag{display:inline-block;border-radius:5px;padding:1px 7px;font-size:12.5px;font-weight:500;white-space:nowrap}
.pri{display:inline-block;border-radius:5px;padding:1px 7px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pri.p1{color:var(--hot);background:var(--hots)}
.pri.p2{color:var(--accent);background:var(--accent-soft)}
.pri.p3{color:var(--muted);background:var(--bg)}
.agent{font-weight:700}
.branch{font-size:12.5px;color:var(--muted)}
.cmt{font-size:13.5px;min-width:220px}
.cum{font-weight:700;color:var(--accent)}
.empty{padding:24px;text-align:center;color:var(--muted)}
.foot{font-size:12.5px;color:var(--muted);margin:0}
</style>

<style>
:root{--hero:#1c3264;--hero-ink:#ffffff}
@media (max-width:640px){.headrow h2{display:none}.headrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.kv strong{font-size:19px}}
.calc b{white-space:nowrap}
.cmt{min-width:0!important;white-space:nowrap;font-size:13px;color:var(--muted)}
td.num{white-space:nowrap}
.hl{background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:4px;padding:0 4px}
.fromto{font-size:12px;color:var(--muted);font-family:var(--f-num);white-space:nowrap}
.calc{font-size:14px;font-family:var(--f-num);background:var(--bg);border-radius:6px;padding:6px 8px}
.calc b{color:var(--ink)}
.gain{font-weight:700;color:var(--accent);white-space:nowrap}
.low{color:var(--muted)}
.plan-sum{font-size:16px;margin:0}
.plan-sum b{color:var(--accent)}
.note{font-size:13px;color:var(--muted);margin:0}
[hidden]{display:none!important}
.home-hero{display:grid;gap:4px}
.home-hero h1{margin:0;font-size:28px;letter-spacing:-.02em}
.home-hero p{margin:0;color:var(--muted);font-size:13px}
.single{display:grid;gap:16px;min-width:0}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--bg);padding-block:8px;margin-inline:-16px;padding-inline:16px}
.appbar-title{min-width:0;display:grid}
.appbar-title h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar-title p{margin:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#detail .appbar-title{text-align:center;flex:1}
#detail .appbar-title h1{font-size:18px}
.iconbtn{all:unset;box-sizing:border-box;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink);background:var(--surface);border:1px solid var(--line);cursor:pointer;flex:none}
.iconbtn:active{transform:scale(.94)}
.iconbtn:focus-visible{outline:2px solid var(--accent)}

.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.tab{all:unset;box-sizing:border-box;text-align:center;padding:10px;border-radius:10px;font-weight:700;font-size:15px;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{background:var(--hero);color:#fff}
.tab:focus-visible{outline:2px solid var(--accent)}
.ags{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
@media (max-width:640px){.ags{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ag{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0;transition:transform .12s}
.ag:active{transform:scale(.97)}
.ag:hover{border-color:var(--accent)}
.ag:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ag .an{font-weight:700;font-size:15px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.ag .ah{font-family:var(--f-num);font-size:24px;font-weight:700;line-height:1.1}
.ag .ah small{font-size:13px;font-weight:500;color:var(--muted);margin-left:2px}
.ag .am{font-size:12.5px;color:var(--muted);line-height:1.5}
.ag .am b{color:var(--ink);font-family:var(--f-num)}
.ag .ap{margin-top:auto;font-size:12.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:10px;padding:5px 8px}
.aglist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.ac{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:4px;background:var(--surface)}
.ac .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.ac .meta{font-size:13px;color:var(--muted)}
.ac.done{opacity:.55}
.ac label{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);cursor:pointer}
.maxed{font-size:13px;color:var(--muted);margin:0}
.agback{justify-self:start}
.hero .lbl{font-size:13px;opacity:.85}
.hero .big{font-family:var(--f-num);font-size:40px;font-weight:700;line-height:1}
.hero .big small{font-size:18px;font-weight:500;margin-left:2px}
.hero .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero .st{background:rgba(255,255,255,.12);border-radius:12px;padding:8px 10px;display:grid}
.hero .st span{font-size:12px;opacity:.85}
.hero .st b{font-family:var(--f-num);font-size:18px}
.crit{display:grid;grid-template-columns:repeat(4,minmax(0,max-content));justify-content:center;gap:6px}
.crit span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:12.5px;color:var(--muted);text-align:center;white-space:nowrap}
.crit b{color:var(--ink);font-family:var(--f-num)}
@media (max-width:400px){.crit{gap:4px}.crit span{padding:5px 7px;font-size:12px}}
.sec-head{display:flex;justify-content:space-between;align-items:baseline}
.sec-head h2{margin:0;font-size:17px}
.sec-head span{font-size:12.5px;color:var(--muted)}
.mgrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
@media (max-width:640px){.mgrs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mc{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px;aspect-ratio:1/1;min-width:0;transition:transform .12s}
.mc:active{transform:scale(.97)}
.mc:hover{border-color:var(--accent)}
.mc:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mc .tp{display:flex;align-items:center;justify-content:space-between;gap:6px}
.av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:15px;background:var(--accent-soft);color:var(--accent);flex:none}
.chev{color:var(--muted);flex:none}
.mc .nm{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc .hh{font-family:var(--f-num);font-size:30px;font-weight:700;line-height:1.1}
.mc .hh small{font-size:14px;font-weight:500;color:var(--muted);margin-left:2px}
.mc .sub2{font-size:12.5px;color:var(--muted);line-height:1.45}
.mc .sub2 b{color:var(--ink);font-family:var(--f-num)}
.mc .bar{height:6px;margin-top:auto}
.mc .go{font-size:12.5px;color:var(--accent);font-weight:500;background:var(--accent-soft);border-radius:10px;padding:5px 8px;line-height:1.4}
@media (prefers-reduced-motion:reduce){.mc,.iconbtn{transition:none}.mc:active,.iconbtn:active{transform:none}}
.cards{display:none}
@media (max-width:640px){
  .plan-tbl{display:none}
  .cards{display:grid;gap:8px}
  .pc{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:4px}
  .pc .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .pc .meta{font-size:13px;color:var(--muted)}
  .pc.done{opacity:.55}
}
</style>

<div class="wrap">
  <section id="home" class="single">
    <header class="appbar">
      <div class="appbar-title">

      </button>

    <div class="mgrs" id="mgrs"></div>
  </section>

  <section id="detail" class="single" hidden>
    <header class="appbar">
      <button class="iconbtn" id="backBtn" type="button" aria-label="전체 매니저로">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="appbar-title"><h1 id="dTitle">매니저</h1></div>
      <span style="width:40px"></span>
    </header>
    <section class="card" id="summary"></section>
    <div class="tabs" role="tablist" aria-label="보기 기준">
      <button class="tab" role="tab" id="tabA" type="button" aria-selected="true">설계사 기준</button>
      <button class="tab" role="tab" id="tabB" type="button" aria-selected="false">대리점 기준</button>

          <input type="search" id="q" placeholder="설계사·지사 검색">

        </div>
        <div class="tbl-wrap">
          <table>
            <thead><tr><th class="c">터치</th><th>추천</th><th>설계사</th><th class="r">현재 실적</th><th class="r">남은 금액</th><th class="r">설계건수</th><th class="r">건당 보험료</th><th class="r">체결 시</th><th>코멘트</th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <p class="foot">추천은 1건 체결 시 늘어나는 환산인원, 남은 금액(2만원 미만은 낮게), 진행 설계 수를 함께 봐요. 건당 보험료·진행 설계는 설계지원건별 시트에서 중복여부(AH열)가 1인 인보험 설계만 사용해요. 터치 체크는 이 브라우저에만 저장돼요.</p>
      </section>
    </div>
    <div id="viewB" class="single" hidden></div>

// 설계사 1명 = 다음 1건 체결(건당 설계보험료)로 늘어나는 환산인원 × 체결 가능성
function candidate(m,br,ag,code,amt,cnt,avgP,pend){
  if(amt>=200000) return null;
  const next=amt<=0?0:amt<50000?50000:amt<100000?100000:200000;
  const gap=next?next-amt:0;
  // 다음 1건 = 건당 설계보험료(최저 2만원), 실적자는 최소한 다음 구간까지 채우는 건으로 가정
  const P=Math.max(avgP||0,MIN_PREM,gap);
  const gain=conv(amt+P)-conv(amt);
  if(gain<=0) return null;
  let t=4;
  if(amt<=0) t=0;
  else if(amt>=20000&&amt<50000) t=1;
  else if(amt>=70000&&amt<100000) t=2;
  else if(amt>=150000&&amt<200000) t=3;
  const lowGap=amt>0&&gap<MIN_PREM;
  // 체결 가능성: 진행 설계(활동량) × 이번 달 체결 이력 × 남은 금액 난이도
  const act=cnt<=0&&pend<=0?0.15:Math.min(1,0.3+pend*0.07);
  const track=amt>0?1:0.4;
  const ease=amt<=0?1:gap<MIN_PREM?0.4:gap<=50000?1:gap<=100000?0.8:0.6;
  const score=gain*act*track*ease;
  const pri=score>=0.6?1:score>=0.35?2:3;
  return {m,br,ag,code,amt,cnt,avgP,pend,t,gap,next,gain,lowGap,score,pri,P,after:amt+P,from:conv(amt),to:conv(amt+P),cmt:comment(avgP,pend)};
}
const man=n=>`${(n/10000).toFixed(1).replace(/\.0$/,'')}만`;
function calcLine(p){

  return p.amt>0

    : `실적 0 + ${add} = <b>${man(p.after)}</b> → 0명 ▸ <b>${fmtH(p.to)}명</b>`;
}
const gainCell=p=>`<span class="gain">+${fmtH(p.gain)}명</span><div class="fromto">${fmtH(p.from)}→${fmtH(p.to)}명</div>`;
function comment(avgP,pend){
  return `진행 ${pend}건 · <mark class="hl">건당 ${avgP?'약 '+wonR(avgP):'-'}</mark>`;
}

function compute(){
  const tiers=[...DATA.tiers].sort((a,b)=>a.h-b.h);
  const by={};
  activeRows().forEach(([m,br,ag,code,amt,hc,cnt,avgP,pend])=>{
    (by[m]??={name:m,h:0,people:0,cands:[],all:[]});
    const o=by[m]; const c=conv(amt); o.h+=c; if(c>0)o.people++;
    o.all.push({br,ag,amt});
    const cd=candidate(m,br,ag,code,amt,cnt,avgP||0,pend||0); if(cd) o.cands.push(cd);
  });
  Object.values(by).forEach(o=>{
    o.cands.sort((a,b)=>b.score-a.score||b.gain-a.gain||b.pend-a.pend);
    o.near=o.cands.filter(c=>c.t<4);
    o.cur=[...tiers].reverse().find(t=>o.h>=t.h)||null;
    o.next=tiers.find(t=>t.h>o.h)||null;

}

  const total=C.mgrs.reduce((s,o)=>s+o.h,0);

  const topAll=C.mgrs.reduce((s,o)=>s+o.cands.filter(c=>c.pri===1).length,0);
  hero.innerHTML=`<div class="lbl">지점 유실적 환산인원</div>
    <div class="big">${fmtH(total)}<small>명</small></div>
    <div class="stats"><div class="st"><span>매니저</span><b>${C.mgrs.length}명</b></div><div class="st"><span>근접자</span><b>${nearAll}명</b></div><div class="st"><span>최우선 터치</span><b>${topAll}명</b></div></div>`;
  mgrs.innerHTML=C.mgrs.map(o=>{
    const top=o.cands.filter(c=>c.pri===1).length;
    const diff=o.next?o.next.h-o.h:0; let s=0,n=0;
    if(o.next) for(const c of o.cands){if(s>=diff-1e-9)break;s+=c.gain;n++}
    return `<button class="mc" type="button" data-m="${o.name}">
      <span class="tp"><span class="av">${o.name.slice(-2)}</span><svg class="chev" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="nm">${o.name}</span>
      <span class="hh">${fmtH(o.h)}<small>명</small></span>
      <span class="sub2">${o.next?`${o.next.h}명까지 <b>${fmtH(diff)}명</b>`:'최고 구간'}<br>최우선 <b>${top}</b>명</span>
      <span class="bar"><i style="width:${Math.min(100,o.h/max*100)}%"></i></span>
      ${o.next?`<span class="go">${n}명 체결 시 ${o.next.h}명</span>`:''}
    </button>`}).join('');
  mgrs.querySelectorAll('.mc').forEach(b=>b.onclick=()=>openMgr(b.dataset.m));
}
function openMgr(name){sel=name;filt='all';target=null;document.getElementById('q').value='';
  home.hidden=true;detail.hidden=false;dTitle.textContent=name;renderMgr();window.scrollTo(0,0);}
function goHome(){detail.hidden=true;home.hidden=false;renderHome();window.scrollTo(0,0);}
backBtn.onclick=goHome;
function renderSummary(){
  const o=curM();
  if(!target||target.h<=o.h) target=o.next;
  summary.innerHTML=`<div class="headrow">
      <h2>${o.name}</h2>
      ${o.months!=null?`<div class="kv"><span>차월</span><strong>${o.months}</strong></div>`:''}
      <div class="kv"><span>유실적</span><strong>${o.people}명</strong></div>
      <div class="kv"><span>환산인원</span><strong>${fmtH(o.h)}명</strong></div>
      <div class="kv"><span>지급액</span><strong>${o.cur?o.cur.pay:0}</strong></div>
    </div>
    <p class="ladder-label">목표 구간을 누르면 플랜이 바뀌어요.</p>
    <div class="ladder-wrap"><div class="ladder">${C.tiers.map(t=>{
      const cur=o.cur&&t.h===o.cur.h, got=o.cur&&t.h<o.cur.h, tg=target&&t.h===target.h;
      const cls=cur?'cur':got?'got':tg?'tgt':'';
      return `<button type="button" class="step ${cls}" data-h="${t.h}" ${cur||got?'aria-disabled="true"':''} aria-pressed="${!!tg}"><span class="h">${t.h}명</span>${t.pay}</button>`}).join('')}</div></div>`;
  summary.querySelectorAll('.step').forEach(b=>b.onclick=()=>{
    const h=+b.dataset.h; if(h<=o.h) return; target=C.tiers.find(t=>t.h===h); renderSummary(); renderPlan();});
}
function renderPlan(){
  const o=curM();
  if(!target){plan.innerHTML=`<h3>베스트 플랜</h3><p class="plan-sum">최고 구간 <b>${o.cur.h}명</b> 달성. 유지가 목표예요.</p>`;return}
  const diff=target.h-o.h;
  const picks=[]; let sum=0;
  for(const c of o.cands){ if(sum>=diff-1e-9) break; picks.push(c); sum+=c.gain; }
  const short=diff-sum;
  let cum=o.h;
  const rows=picks.map((p,i)=>{cum+=p.gain;return {p,i,cum}});
  plan.innerHTML=`<h3>베스트 플랜 · ${target.h}명 (지급 ${target.pay})</h3>
    <p class="plan-sum">${fmtH(diff)}명 부족 → 아래 <b>${picks.length}명</b> 1건씩 체결 시 <b>+${fmtH(sum)}명</b>${short>1e-9?`<br><span class="warn">${fmtH(short)}명은 신규 가동 필요</span>`:''}</p>
    ${picks.length?`<div class="tbl-wrap plan-tbl"><table><thead><tr><th class="c">순서</th><th>설계사</th><th class="r">현재 실적</th><th class="r">남은 금액</th><th class="r">설계건수</th><th class="r">건당 보험료</th><th class="r">체결 시</th><th>코멘트</th><th class="r">누적</th></tr></thead><tbody>${
      rows.map(({p,i,cum})=>`<tr class="${done[p.code]?'done':''}">
        <td class="c num">${i+1}</td>
        <td><div class="agent">${p.ag}</div><div class="branch">${p.br}</div></td>
        <td class="r num">${p.amt>0?won(p.amt):'-'}</td>
        <td class="r num">${p.amt>0?won(p.gap):'첫 체결'}</td>
        <td class="r num">${p.cnt}</td>
        <td class="r num">${p.avgP?wonR(p.avgP):'-'}</td>
        <td class="r">${gainCell(p)}</td>
        <td class="cmt">${p.cmt}</td>
        <td class="r num cum">${fmtH(cum)}명</td></tr>`).join('')}</tbody></table></div>
    <div class="cards">${rows.map(({p,i,cum})=>`<div class="pc ${done[p.code]?'done':''}">
        <div class="top"><span class="agent">${i+1}. ${p.ag}</span><span class="gain">+${fmtH(p.gain)}명 → ${fmtH(cum)}명</span></div>
        <div class="meta">${p.br}</div>
        <div class="meta">${p.amt>0?`실적 ${won(p.amt)} · 남은 ${won(p.gap)}`:'미체결'} · 설계 ${p.cnt}건</div>
        <div class="calc">${calcLine(p)}</div>
        <div class="meta">진행 설계 ${p.pend}건</div></div>`).join('')}</div>`:''}`;
}
function renderChips(){
  const o=curM(); const cnt=TYPES.map(t=>o.cands.filter(x=>x.t===t.k).length);
  const low=o.cands.filter(x=>x.lowGap).length;
  chips.innerHTML=`<button class="chip tall" type="button" data-f="all" aria-pressed="${filt==='all'}">추천순 ${o.cands.length}</button>`+
    TYPES.map(t=>`<button class="chip ${t.cls}" type="button" data-f="${t.k}" aria-pressed="${filt==String(t.k)}">${t.name} ${cnt[t.k]}</button>`).join('')+
    `<button class="chip tall" type="button" data-f="low" aria-pressed="${filt==='low'}">2만 미만 남음 ${low}</button>`;
  chips.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{filt=b.dataset.f;renderChips();renderTable()});
}
function renderTable(){
  const o=curM();
  const q=document.getElementById('q').value.trim(); const hide=hideDone.checked;
  const L=o.cands.filter(x=>filt==='all'||(filt==='low'?x.lowGap:String(x.t)===filt))
    .filter(x=>!q||(x.ag+x.br+x.code).includes(q))
    .filter(x=>!hide||!done[x.code]);
  if(!L.length){tbody.innerHTML=`<tr><td colspan="9" class="empty">조건에 맞는 설계사가 없어요.</td></tr>`;return}
  tbody.innerHTML=L.map(x=>{const T=TYPES[x.t];const isD=!!done[x.code];
    return `<tr class="${isD?'done':''}">
      <td class="c"><input type="checkbox" id="d_${x.code}" data-c="${x.code}" ${isD?'checked':''} aria-label="${x.ag} 터치완료"></td>
      <td><span class="pri p${x.pri}">${PN[x.pri]}</span></td>
      <td><div class="agent">${x.ag} <span class="tag ${T.cls}">${T.name}</span></div><div class="branch">${x.br}</div></td>
      <td class="r num">${x.amt>0?won(x.amt):'-'}</td>
      <td class="r num ${x.lowGap?'low':''}">${x.amt>0?won(x.gap):'첫 체결'}</td>
      <td class="r num">${x.cnt}</td>
      <td class="r num">${x.avgP?wonR(x.avgP):'-'}</td>
      <td class="r">${gainCell(x)}</td>
      <td class="cmt">${x.cmt}</td></tr>`}).join('');
  tbody.querySelectorAll('input[type=checkbox]').forEach(c=>c.onchange=()=>{
    if(c.checked)done[c.dataset.c]=1;else delete done[c.dataset.c];store.set('touchDone',done);renderTable();renderPlan()});
}
let view='A', agSel=null;
function setView(v){view=v;agSel=null;tabA.setAttribute('aria-selected',v==='A');tabB.setAttribute('aria-selected',v==='B');
  viewA.hidden=v!=='A';viewB.hidden=v!=='B';if(v==='B')renderAgencies();}
tabA.onclick=()=>setView('A'); tabB.onclick=()=>setView('B');
function agencies(o){
  const map={};
  o.all.forEach(a=>{const g=(map[a.br]??={name:a.br||'(지사 미상)',h:0,n:0,act:0,cands:[],maxed:[]});g.n++;g.h+=conv(a.amt);if(a.amt>0)g.act++;if(a.amt>=200000)g.maxed.push(a.ag)});
  o.cands.forEach(c=>map[c.br].cands.push(c));
  return Object.values(map).map(g=>({...g,gain:g.cands.reduce((s,c)=>s+c.gain,0),top:g.cands.filter(c=>c.pri===1).length,unc:g.cands.filter(c=>c.t===0).length,best:g.cands.reduce((s,c)=>s+c.score,0)}))
    .sort((a,b)=>b.top-a.top||b.best-a.best);
}
function agentCard(p){
  const T=TYPES[p.t];const isD=!!done[p.code];
  return `<div class="ac ${isD?'done':''}">
    <div class="top"><span class="agent">${p.ag} <span class="tag ${T.cls}">${T.name}</span></span><span class="gain">+${fmtH(p.gain)}명</span></div>
    <div class="meta"><span class="pri p${p.pri}">${PN[p.pri]}</span> ${p.amt>0?`실적 ${won(p.amt)} · 남은 ${won(p.gap)}`:'미체결'} · 설계 ${p.cnt}건</div>
    <div class="calc">${calcLine(p)}</div>
    <div class="top"><span class="meta">진행 설계 ${p.pend}건</span><label><input type="checkbox" data-c="${p.code}" ${isD?'checked':''}> 터치완료</label></div>
  </div>`;
}
function renderAgencies(){
  const o=curM(); const A=agencies(o);
  if(agSel){
    const g=A.find(x=>x.name===agSel); if(!g){agSel=null;return renderAgencies();}
    viewB.innerHTML=`<button class="btn agback" id="agBack" type="button">‹ 대리점 목록</button>
      <section class="card"><h3>${g.name}</h3>
      <p class="plan-sum">설계사 ${g.n}명 · 현재 <b>${fmtH(g.h)}명</b> · 전원 1건씩 체결 시 <b>+${fmtH(g.gain)}명</b></p>
      ${g.cands.length?`<div class="aglist">${g.cands.map(agentCard).join('')}</div>`:'<p class="maxed">추가로 올릴 수 있는 설계사가 없어요.</p>'}
      ${g.maxed.length?`<p class="maxed">20만 이상 달성: ${g.maxed.join(', ')}</p>`:''}</section>`;
    agBack.onclick=()=>{agSel=null;renderAgencies();window.scrollTo(0,0)};
    viewB.querySelectorAll('input[type=checkbox]').forEach(c=>c.onchange=()=>{if(c.checked)done[c.dataset.c]=1;else delete done[c.dataset.c];store.set('touchDone',done);renderAgencies();renderPlan();renderTable()});
    return;
  }
  viewB.innerHTML=`<div class="sec-head"><h2>대리점 ${A.length}곳</h2><span>최우선 많은 순</span></div>
    <div class="ags">${A.map(g=>`<button class="ag" type="button" data-g="${g.name.replace(/"/g,'&quot;')}">
      <span class="an">${g.name}</span>
      <span class="ah">${fmtH(g.h)}<small>명</small></span>
      <span class="am">설계사 <b>${g.n}</b>명 · 유실적 <b>${g.act}</b>명<br>최우선 <b>${g.top}</b>명 · 미체결 <b>${g.unc}</b>명</span>
      <span class="ap">${g.cands.length?`1건씩 체결 시 +${fmtH(g.gain)}명`:'추가 대상 없음'}</span>
    </button>`).join('')}</div>`;
  viewB.querySelectorAll('.ag').forEach(b=>b.onclick=()=>{agSel=b.dataset.g;renderAgencies();window.scrollTo(0,0)});
}
function renderMgr(){renderSummary();renderPlan();renderChips();renderTable();setView('A')}
function renderAll(){C=compute();
  if(!C.mgrs.length){detail.hidden=true;home.hidden=false;mgrs.innerHTML='<p class="plan-sum">상단 <b>새 실적파일 불러오기</b>로 실적 엑셀을 열어 주세요.</p>';
    srcInfo.textContent='실적파일을 불러와 주세요';return}
  srcInfo.textContent=`${DATA.src||'업로드 파일'} · 매니저 ${C.mgrs.length}명 · 설계사 ${activeRows().length.toLocaleString()}명`;
  goHome();}

// ---- upload ----
uploadBtn.onclick=()=>file.click();
file.onchange=async()=>{
  const f=file.files[0]; if(!f)return; stat.hidden=false;stat.textContent='읽는 중…';
  try{
    if(!window.XLSX) throw new Error('엑셀 읽기 도구를 불러오지 못했어요. 새로고침 후 다시 시도해 주세요.');
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    const next=parseWb(wb); next.src=f.name; DATA=next; done={}; store.set('touchDone',done);
    renderAll(); stat.textContent=`불러옴: ${f.name}`;
  }catch(e){stat.textContent=e.message}
  file.value='';
};
const norm=v=>typeof v==='string'?v.replace(/\s/g,''):v;
function grid(ws){return XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true})}
function designStats(wb){
  const ws=wb.Sheets['실적표설계지원건별']; const out={}; if(!ws) return out;
  const g=grid(ws); const hi=g.findIndex(r=>r&&r.map(norm).includes('계약담당코드')&&r.map(norm).includes('체결여부'));
  if(hi<0) return out;
  const H=g[hi].map(norm);
  const ci=H.indexOf('계약담당코드'), pi=H.indexOf('상품구분'), mi=H.indexOf('월납기준보험료'), yi=H.indexOf('체결여부'), si=H.indexOf('계약상태');
  // AH열 '중복여부'가 1인 설계만 사용 (열 이름으로 찾고, 없으면 AH열 위치 사용)
  let di=H.indexOf('중복여부'); if(di<0&&H.length>33) di=33;
  for(let i=hi+1;i<g.length;i++){const r=g[i]; if(!r||!r[ci]||r[pi]!=='인보험')continue;
    if(di>=0&&+r[di]!==1)continue;
    const d=(out[String(r[ci])]??={s:0,n:0,pend:0});
    const p=+r[mi]; if(p>0){d.s+=p;d.n++}
    if(r[yi]==='N'&&!String(r[si]||'').includes('거절')) d.pend++;}
  return out;
}
function parseWb(wb){
  const ls=wb.Sheets['LIST']; if(!ls) throw new Error("'LIST' 시트를 찾지 못했어요. 같은 양식의 파일인지 확인해 주세요.");
  const g=grid(ls); const hi=g.findIndex(r=>r&&r.includes('매니저')&&r.includes('설계사'));
  if(hi<0) throw new Error("LIST 시트에서 '매니저·설계사' 머리글 행을 찾지 못했어요.");
  const H=g[hi]; const ix=n=>H.findIndex(v=>typeof v==='string'&&v.replace(/\s/g,'').startsWith(n));
  const c={m:ix('매니저'),br:ix('지사명'),ag:ix('설계사'),code:ix('설계사코드'),amt:ix('실적'),hc:ix('하이캡'),cnt:ix('설계건수')};
  if(c.code<0)c.code=c.ag+1;
  const ds=designStats(wb);
  const rows=[];
  for(let i=hi+1;i<g.length;i++){const r=g[i]; if(!r||!r[c.m]||typeof r[c.m]!=='string')continue;
    const code=String(r[c.code]||''); const d=ds[code];
    rows.push([r[c.m],r[c.br]||'',r[c.ag]||'',code,Math.round((+r[c.amt]||0)*1000),Math.round((+r[c.hc]||0)*1000),+r[c.cnt]||0,d&&d.n?Math.round(d.s/d.n):0,d?d.pend:0]);}
  if(!rows.length) throw new Error('LIST 시트에 설계사 데이터가 없어요.');
  let tiers=DEFAULT.tiers, tenure={};
  const ss=wb.Sheets['유실적현황'];
  if(ss){const s=grid(ss);
    const hr=s.findIndex(r=>r&&r.some(v=>v==='환산인원'));
    if(hr>=0&&s[hr+1]&&s[hr+1].some(v=>v==='지급액')){
      const a=s[hr].indexOf('환산인원'),b=s[hr+1].indexOf('지급액');const t=[];
      for(let j=1;j<40;j++){const h=s[hr][a+j],p=s[hr+1][b+j];if(typeof h==='number'&&typeof p==='number')t.push({h,pay:p})}
      if(t.length)tiers=t;}
    const mg=new Set(rows.map(r=>r[0]));
    s.forEach(r=>{if(r&&mg.has(r[1])&&typeof r[2]==='number')tenure[r[1]]=r[2]});
  }
  return {tiers,tenure,rows};
}
document.getElementById('q').oninput=renderTable; hideDone.onchange=renderTable;
renderAll();
</script>
